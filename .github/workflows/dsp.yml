name: Fast headless DSP checks
on:
  pull_request:
    paths:
      - "Source/DSP/**"
      - "WebUI/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/dsp.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dsp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure native core (no JUCE download)
        run: cmake -S . -B build -DARSONEQ_BUILD_PLUGIN=OFF -DARSONEQ_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile native tests
        run: cmake --build build --config Release --parallel 2
      - name: Test DSP, transitions, analyzer queue
        run: ctest --test-dir build -C Release --output-on-failure
      - name: JS syntax + offline UI bridge smoke (no npm needed)
        run: |
          node --check WebUI/app.js
          node WebUI/smoke.test.cjs
      - name: Capture 900x535 editor visual QA (no JUCE build)
        shell: bash
        run: |
          node WebUI/visual-qa.cjs
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [[ -z "$CHROME" ]]; then
            echo "Chromium unavailable; skipping image snapshot"
            exit 0
          fi
          mkdir -p visual-qa
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1200 --window-size=900,535 --screenshot="$PWD/visual-qa/ArSonEQ-M2.4-900x535.png" "file://$PWD/WebUI/visual-qa.generated.html"
          test -s visual-qa/ArSonEQ-M2.4-900x535.png
      - name: Publish actual browser rendering for UI review
        uses: actions/upload-artifact@v4
        with:
          name: ArSonEQ-M2-4-GUI-Visual-QA
          path: visual-qa/ArSonEQ-M2.4-900x535.png
          if-no-files-found: warn
          retention-days: 7
