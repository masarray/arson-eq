name: Fast headless DSP checks
on:
  pull_request:
    paths:
      - "Source/DSP/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/dsp.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dsp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure native core (no JUCE download)
        run: cmake -S . -B build -DARSONEQ_BUILD_PLUGIN=OFF -DARSONEQ_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile native tests
        run: cmake --build build --config Release --parallel 2
      - name: Test DSP, transitions, analyzer queue
        run: ctest --test-dir build -C Release --output-on-failure
