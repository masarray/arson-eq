name: Windows VST3 + Standalone Release
on:
  pull_request:
    paths:
      - "Source/**"
      - "WebUI/index.html"
      - "WebUI/style.css"
      - "WebUI/app.js"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/vst3-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-dual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-dual:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned WebView2 SDK
        uses: actions/cache@v4
        id: webview2
        with:
          path: ${{ runner.temp }}/arsoneq-nuget
          key: webview2-sdk-1.0.3485.44
      - name: Install WebView2 SDK (build-time only)
        if: steps.webview2.outputs.cache-hit != 'true'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory "$env:RUNNER_TEMP/arsoneq-nuget" -NonInteractive
      - name: Configure pinned JUCE 9.0.4 and all tests
        shell: pwsh
        run: cmake -S . -B build-vst -DARSONEQ_BUILD_PLUGIN=ON -DARSONEQ_BUILD_TESTS=ON "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP/arsoneq-nuget"
      - name: Build BOTH Windows Release formats + native tests
        run: cmake --build build-vst --config Release --target ArSonEQ_VST3 ArSonEQ_Standalone arson_eq_core_tests arson_eq_rt_tests arson_eq_analyzer_tests --parallel 2
      - name: Run 3 native DSP suites
        run: ctest --test-dir build-vst -C Release --output-on-failure
      - name: Package verified VST3 and Standalone EXE together
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "build-vst/ArSonEQ_artefacts/Release"
          $vst = Join-Path $root "VST3/ArSonEQ.vst3"
          $standaloneDir = Join-Path $root "Standalone"
          if (!(Test-Path $vst -PathType Container)) { throw "Missing VST3 bundle: $vst" }
          $exe = Get-ChildItem $standaloneDir -Filter "ArSonEQ.exe" -File -ErrorAction Stop | Select-Object -First 1
          if ($null -eq $exe) { throw "Missing Standalone EXE in $standaloneDir" }
          if ($exe.Length -lt 100000) { throw "Unexpectedly small Standalone EXE" }
          $dll = Get-ChildItem $vst -Recurse -File -Filter "*.vst3" | Select-Object -First 1
          if ($null -eq $dll -or $dll.Length -lt 100000) { throw "Missing compiled VST3 module" }
          $out = "dist/ArSonEQ-M2.5-Windows-x64"
          New-Item -ItemType Directory -Force "$out/VST3","$out/Standalone" | Out-Null
          Copy-Item -Path $vst -Destination "$out/VST3/" -Recurse -Force
          Copy-Item -Path $exe.FullName -Destination "$out/Standalone/ArSonEQ.exe" -Force
          Copy-Item -Path "packaging/README_WINDOWS_TEST.txt" -Destination "$out/README_WINDOWS_TEST.txt" -Force
          Set-Content -Path "$out/BUILD.txt" -Value @(
            "Project: ArSonEQ M2.5 native stereo FFT + quick editor engineering test"
            "Commit: ${{ github.sha }}"
            "Windows: x64 / Release"
            "Targets: VST3 + Standalone"
            "JUCE: 9.0.4; GUI: bundled offline WebView2"
            "VST3 module bytes: $($dll.Length)"
            "Standalone exe bytes: $($exe.Length)"
            "Both produced by a single CI run."
          ) -Encoding utf8
          Get-ChildItem $out -Recurse | Select-Object FullName,Length
      - name: Upload combined VST3 + Standalone test package
        uses: actions/upload-artifact@v4
        with:
          name: ArSonEQ-M2-5-Windows-x64-VST3-Standalone-TEST
          path: dist/ArSonEQ-M2.5-Windows-x64/
          if-no-files-found: error
          retention-days: 14
