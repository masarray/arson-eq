name: Windows VST3 build + native tests
on:
  pull_request:
    paths:
      - "Source/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/vst3-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vst3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  vst3:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned WebView2 SDK
        uses: actions/cache@v4
        id: webview2
        with:
          path: ${{ runner.temp }}/arsoneq-nuget
          key: webview2-sdk-1.0.3485.44
      - name: Install WebView2 headers and loader (build-time only)
        if: steps.webview2.outputs.cache-hit != 'true'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory "$env:RUNNER_TEMP/arsoneq-nuget" -NonInteractive
      - name: Configure pinned JUCE and headless tests
        shell: pwsh
        run: cmake -S . -B build-vst -DARSONEQ_BUILD_PLUGIN=ON -DARSONEQ_BUILD_TESTS=ON "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP/arsoneq-nuget"
      - name: Compile Release VST3 and tests
        run: cmake --build build-vst --config Release --target ArSonEQ_VST3 arson_eq_core_tests arson_eq_rt_tests arson_eq_analyzer_tests --parallel 2
      - name: Verify native tests on Windows
        run: ctest --test-dir build-vst -C Release --output-on-failure
      - name: Publish test-only VST3
        uses: actions/upload-artifact@v4
        with:
          name: ArSonEQ-M1-5-Windows-x64-VST3-TEST
          path: build-vst/ArSonEQ_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 7
